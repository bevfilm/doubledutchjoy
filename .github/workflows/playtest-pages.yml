name: Build and deploy Double Dutch Joy playtest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "My project4/**"
      - ".github/workflows/playtest-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install GDevelop exporter
        run: npm install --global gdexporter@4.0.0-beta7

      - name: Export Double Dutch Joy to HTML5
        run: |
          mkdir -p _site
          gdexport \
            --project "My project4/Double Dutch Joy.json" \
            --out "_site"
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload playable game
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
